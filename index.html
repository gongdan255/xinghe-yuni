<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05050b">
  <title>星河予你 · 3D 星云爱心</title>
  <style>
    :root { color-scheme: dark; --accent:#f5a9d0; --glow:rgba(245,122,181,.38); font-family: Georgia,"Songti SC","STSong",serif; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; overflow:hidden; background:#05050b; color:#fff; }
    body { background:radial-gradient(ellipse at 50% 42%,#15101d 0%,#080711 48%,#05050b 100%); }
    #scene { position:fixed; inset:0; touch-action:none; }
    #scene canvas { display:block; width:100%; height:100%; }
    .brand { position:fixed; z-index:2; left:clamp(22px,3.2vw,48px); top:clamp(23px,3.3vw,43px); pointer-events:none; }
    .brand span { display:block; color:#c8afc6; font:10px/1.4 Arial,sans-serif; letter-spacing:.37em; opacity:.74; }
    .brand h1 { margin:8px 0 0; font-weight:400; font-size:clamp(17px,1.6vw,23px); letter-spacing:.22em; text-shadow:0 0 25px var(--glow); }
    .themes { position:fixed; z-index:4; top:clamp(27px,3.5vw,49px); right:clamp(22px,3.6vw,50px); display:flex; gap:12px; align-items:center; }
    .theme { width:22px; height:22px; padding:0; border:1px solid #ffffff70; border-radius:50%; cursor:pointer; box-shadow:0 0 11px #ffffff20; transition:transform .25s,box-shadow .25s; }
    .theme:hover,.theme:focus-visible { transform:scale(1.22); outline:none; box-shadow:0 0 0 3px #ffffff25,0 0 18px currentColor; }
    .theme.active { box-shadow:0 0 0 3px #ffffff38,0 0 17px #ffffff9c; transform:scale(1.1); }
    .theme:nth-child(1){background:linear-gradient(135deg,#ff4f96,#ffe0ea)}
    .theme:nth-child(2){background:linear-gradient(135deg,#11efd2,#5284ff)}
    .theme:nth-child(3){background:linear-gradient(135deg,#ff664c,#ffdb84)}
    .theme:nth-child(4){background:linear-gradient(135deg,#7653ff,#f4b5ff)}
    .theme:nth-child(5){background:conic-gradient(#ff70a6,#7598ff,#65edd5,#ffe28d,#ff70a6)}
    .message { position:fixed; z-index:3; left:50%; bottom:clamp(38px,8vh,92px); transform:translateX(-50%); width:min(680px,86vw); text-align:center; pointer-events:none; }
    #wish { display:inline-block; max-width:100%; min-width:4em; padding:5px 12px 9px; outline:0; pointer-events:auto; cursor:text; border-bottom:1px solid transparent; color:#fff5f8; font-size:clamp(19px,2.6vw,29px); font-weight:400; letter-spacing:.19em; line-height:1.5; text-shadow:0 0 15px var(--glow),0 0 40px var(--glow); overflow-wrap:anywhere; }
    #wish:focus { border-color:var(--accent); }
    .error { position:fixed; z-index:8; left:10%; top:45%; width:80%; text-align:center; font:14px/1.7 sans-serif; color:#f6cbdc; display:none; }
    @media(max-width:760px) { .brand span{display:none} .brand h1{margin:0;font-size:17px} .themes{gap:9px} .theme{width:20px;height:20px} .message{bottom:clamp(32px,6vh,65px)} }
  </style>
</head>
<body>

    <button class="theme active" data-theme="0" aria-label="浪漫粉红" title="浪漫粉红"></button>
    <button class="theme" data-theme="1" aria-label="极光青蓝" title="极光青蓝"></button>
    <button class="theme" data-theme="2" aria-label="落日金橙" title="落日金橙"></button>
    <button class="theme" data-theme="3" aria-label="梦幻紫星" title="梦幻紫星"></button>
    <button class="theme" data-theme="4" aria-label="彩虹幻彩" title="彩虹幻彩"></button>
  </nav>
